[project]
name = "resume-builder"
version = "1.0.0"
description = "FastAPI backend for creating, managing, exporting, and improving resumes."
requires-python = ">=3.11,<3.13"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
